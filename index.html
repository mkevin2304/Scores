<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Scores Worldwide</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: linear-gradient(135deg, #0f172a 0%, #1a2a47 100%); 
      color: #e2e8f0; 
      line-height: 1.6;
      min-height: 100vh;
    }
    
    header { 
      background: linear-gradient(90deg, #1e293b 0%, #0f4c75 100%);
      padding: 2rem 1.5rem; 
      display: flex; 
      flex-wrap: wrap; 
      gap: 2rem; 
      align-items: center; 
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      border-bottom: 3px solid #3b82f6;
    }
    
    .header-content {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .logo {
      font-size: 2.5rem;
      animation: rotate 20s linear infinite;
    }
    
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    h1 { 
      font-size: 2rem; 
      font-weight: 700;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      font-size: 0.9rem;
      color: #cbd5e1;
      opacity: 0.8;
    }
    
    .tabs { 
      display: flex; 
      gap: 0.5rem; 
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    
    .tab { 
      background: rgba(51, 65, 85, 0.6);
      border: 2px solid transparent;
      color: white; 
      padding: 0.6rem 1.2rem; 
      border-radius: 25px; 
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
      backdrop-filter: blur(10px);
    }
    
    .tab:hover {
      background: rgba(75, 85, 99, 0.8);
      transform: translateY(-2px);
    }
    
    .tab.active { 
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-color: #60a5fa;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
    }
    
    main { 
      max-width: 1200px; 
      margin: 0 auto; 
      padding: 2rem 1.5rem;
    }
    
    .league { 
      margin-bottom: 2.5rem;
      animation: fadeIn 0.5s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .league h2 { 
      font-size: 1.5rem; 
      margin-bottom: 1rem; 
      color: #60a5fa;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid rgba(96, 165, 250, 0.3);
      font-weight: 700;
    }
    
    .match { 
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 76, 117, 0.3));
      border-radius: 12px; 
      padding: 1.25rem; 
      margin-bottom: 1rem; 
      display: grid; 
      grid-template-columns: 1fr auto 1fr; 
      gap: 1rem; 
      align-items: center;
      border: 1px solid rgba(96, 165, 250, 0.2);
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    
    .match:hover {
      background: linear-gradient(135deg, rgba(30, 41, 59, 1), rgba(15, 76, 117, 0.5));
      border-color: rgba(96, 165, 250, 0.5);
      transform: translateX(5px);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.2);
    }
    
    .team { 
      display: flex; 
      align-items: center; 
      gap: 0.75rem;
      font-weight: 600;
    }
    
    .team.home { 
      justify-content: flex-end; 
      text-align: right; 
    }
    
    .team-logo { 
      width: 40px; 
      height: 40px; 
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }
    
    .score { 
      font-size: 1.8rem; 
      font-weight: 900; 
      min-width: 100px; 
      text-align: center;
      color: #fbbf24;
      font-family: 'Courier New', monospace;
      text-shadow: 0 2px 10px rgba(251, 191, 36, 0.3);
    }
    
    .status { 
      font-size: 0.85rem; 
      color: #94a3b8; 
      text-align: center; 
      grid-column: 1 / -1;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(96, 165, 250, 0.1);
    }
    
    .live { 
      color: #ff4757; 
      font-weight: 700;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    .loading, .error { 
      text-align: center; 
      padding: 4rem 2rem; 
      color: #94a3b8;
      font-size: 1.1rem;
    }
    
    .loading::after {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #3b82f6;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 10px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .error {
      background: rgba(239, 68, 68, 0.1);
      border-left: 4px solid #ef4444;
      text-align: left;
      padding: 2rem;
      border-radius: 8px;
    }
    
    footer { 
      text-align: center; 
      padding: 2.5rem; 
      color: #64748b; 
      font-size: 0.9rem;
      border-top: 1px solid rgba(96, 165, 250, 0.1);
      margin-top: 3rem;
    }
    
    footer a {
      color: #60a5fa;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    
    footer a:hover {
      color: #93c5fd;
      text-decoration: underline;
    }
    
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      
      h1 { font-size: 1.5rem; }
      
      .tabs { width: 100%; }
      
      .match { 
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto auto;
      }
      
      .team { justify-content: center; }
      .team.home { justify-content: center; }
      
      .score { font-size: 1.5rem; }
      
      .logo { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo">⚽</div>
      <div>
        <h1>Live Scores</h1>
        <div class="subtitle">Real-time scores from around the world</div>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-sport="soccer">⚽ Soccer</button>
      <button class="tab" data-sport="basketball">🏀 Basketball</button>
      <button class="tab" data-sport="football">🏈 American Football</button>
      <button class="tab" data-sport="baseball">⚾ Baseball</button>
      <button class="tab" data-sport="hockey">🏒 Hockey</button>
    </div>
  </header>

  <main id="content">
    <div class="loading">Loading live scores...</div>
  </main>

  <footer>
    <p>🌍 <strong>Live Scores Worldwide</strong> | Data powered by <a href="https://www.espn.com" target="_blank">ESPN</a></p>
    <p>Updates every 60 seconds • Not affiliated with any league • Live scores only</p>
    <p style="margin-top: 1rem; font-size: 0.85rem; opacity: 0.7;">Built with ❤️</p>
  </footer>

  <script>
    const SPORTS = {
      soccer: [
        { name: "⚽ Premier League", path: "soccer/eng.1" },
        { name: "🇪🇸 La Liga", path: "soccer/esp.1" },
        { name: "🇮🇹 Serie A", path: "soccer/ita.1" },
        { name: "🇩🇪 Bundesliga", path: "soccer/ger.1" },
        { name: "🏆 Champions League", path: "soccer/uefa.champions" },
        { name: "📍 All Soccer", path: "soccer/all" }
      ],
      basketball: [
        { name: "🏀 NBA", path: "basketball/nba" },
        { name: "🎓 NCAA Men's", path: "basketball/mens-college-basketball" }
      ],
      football: [
        { name: "🏈 NFL", path: "football/nfl" },
        { name: "🎓 College Football", path: "football/college-football" }
      ],
      baseball: [
        { name: "⚾ MLB", path: "baseball/mlb" }
      ],
      hockey: [
        { name: "🏒 NHL", path: "hockey/nhl" }
      ]
    };

    let currentSport = "soccer";
    let refreshInterval;

    async function fetchScoreboard(path) {
      const url = `https://site.api.espn.com/apis/site/v2/sports/${path}/scoreboard`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Failed to fetch");
        return res.json();
      } catch (err) {
        console.error(`Error fetching ${path}:`, err);
        return { events: [] };
      }
    }

    function renderMatch(event) {
      try {
        const comp = event.competitions[0];
        if (!comp) return "";
        
        const home = comp.competitors.find(c => c.homeAway === "home");
        const away = comp.competitors.find(c => c.homeAway === "away");
        
        if (!home || !away) return "";
        
        const status = comp.status.type;
        const isLive = status.state === "in";
        const isFinal = status.completed;
        const homeScore = home.score !== undefined ? home.score : "-";
        const awayScore = away.score !== undefined ? away.score : "-";

        return `
          <div class="match">
            <div class="team away">
              ${away.team.logo ? `<img class="team-logo" src="${away.team.logo}" alt="${away.team.displayName}">` : ""}
              <span>${away.team.shortDisplayName || away.team.displayName}</span>
            </div>
            <div class="score">
              ${awayScore} – ${homeScore}
            </div>
            <div class="team home">
              <span>${home.team.shortDisplayName || home.team.displayName}</span>
              ${home.team.logo ? `<img class="team-logo" src="${home.team.logo}" alt="${home.team.displayName}">` : ""}
            </div>
            <div class="status ${isLive ? "live" : ""}">
              ${isLive ? "● LIVE · " : ""}${status.detail || status.description || "Scheduled"}
            </div>
          </div>
        `;
      } catch (err) {
        console.error("Error rendering match:", err);
        return "";
      }
    }

    async function loadScores() {
      const content = document.getElementById("content");
      content.innerHTML = `<div class="loading">Loading ${currentSport} scores...</div>`;

      try {
        const leagues = SPORTS[currentSport];
        let html = "";
        let totalMatches = 0;

        for (const league of leagues) {
          const data = await fetchScoreboard(league.path);
          const events = data.events || [];

          if (events.length === 0) continue;

          html += `<div class="league"><h2>${league.name}</h2>`;
          events.forEach(e => { 
            const match = renderMatch(e);
            if (match) {
              html += match;
              totalMatches++;
            }
          });
          html += `</div>`;
        }

        if (totalMatches === 0) {
          content.innerHTML = `<div class="loading">No games scheduled right now for ${currentSport}. Check back soon!</div>`;
        } else {
          content.innerHTML = html;
        }
      } catch (err) {
        content.innerHTML = `<div class="error">⚠️ Failed to load scores. This could be due to network issues or ESPN API unavailability. Please try again later.</div>`;
        console.error(err);
      }
    }

    // Tab switching
    document.getElementById("tabs").addEventListener("click", (e) => {
      if (e.target.classList.contains("tab")) {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        e.target.classList.add("active");
        currentSport = e.target.dataset.sport;
        loadScores();
      }
    });

    // Initial load + auto-refresh
    loadScores();
    refreshInterval = setInterval(loadScores, 60000);
    
    // Optional: Log that the page is loaded
    console.log("🌍 Live Scores Worldwide - Ready!");
  </script>
</body>
</html>
